name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # apps/dashboard imports @observatory/shared's compiled output, so
      # every downstream step needs this built first.
      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          DATABASE_PATH: ":memory:"

      - name: Build
        run: npm run build
        env:
          DATABASE_PATH: ":memory:"
